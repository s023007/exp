<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Win a $1000 Amazon Gift Card!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* === GLOBAL STYLES === */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#f4f7f9;
      font-family:Arial,Helvetica,sans-serif;
      text-align:center;
      padding:35px 15px;
      color:#333;
    }

    /* === CARD WRAPPER === */
    .container{
      background:#ffffff;
      max-width:420px;
      margin:0 auto;
      padding:30px 20px 40px;
      border-radius:12px;
      box-shadow:0 8px 18px rgba(0,0,0,.08);
    }

    /* === HEADINGS === */
    h1{
      font-size:28px;
      line-height:1.3;
      color:#e47911;
      margin-bottom:14px;
    }
    p{
      font-size:16px;
      margin-bottom:22px;
    }

    /* === IMAGE === */
    .card-img{
      width:100%;
      height:auto;
      border-radius:10px;
      margin-bottom:24px;
    }

    /* === CTA BUTTON === */
    .button{
      display:inline-block;
      background:#ff9900;
      color:#fff;
      text-decoration:none;
      font-size:18px;
      font-weight:bold;
      padding:14px 28px;
      border-radius:8px;
      transition:background .25s ease;
    }
    .button:hover{background:#cc7a00}
  </style>
</head>
<body>

  <div class="container">
    <h1>Win a $1000 Amazon Gift Card!</h1>
    <p>Enter now for your chance to win!<br>No purchase required.</p>

    <!-- Amazon Gift Card image -->
    <img
      class="card-img"
      src="https://m.media-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png"
      alt="Amazon Gift Card">

    <!-- CTA -->
    <a
      class="button"
      href="https://singingsfiles.com/show.php?l=0&amp;u=178843&amp;id=68652"
      target="_blank" rel="noopener">
      Claim Your Gift Card
    </a>
  </div>

</body>
</html>
