<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Win a $1000 Amazon Gift Card!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f0f4f8;
      text-align: center;
    }

    .top-bar {
      background-color: #002742;
      color: white;
      padding: 18px;
      font-size: 24px;
      font-weight: 600;
    }

    .card {
      background: #fff;
      max-width: 500px;
      margin: 40px auto;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #e48c00;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 24px;
      color: #333;
    }

    img {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    button {
      background-color: #e7a308;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d49105;
    }
  </style>
</head>
<body>

  <div class="top-bar">Limited‑Time Giveaway</div>

  <div class="card">
    <h1>Win a $1000 Amazon Gift Card!</h1>
    <p>Enter your email below and claim your chance. This offer won’t last long!</p>

    <img src="https://images-na.ssl-images-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png" alt="Amazon Gift Card" />

    <form id="leadForm">
      <input type="email" name="user_email" id="user_email" placeholder="Enter your email" required />
      <button type="submit">Claim Now</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init('UWtEugL5TIC6RfnFv'); // Public Key

    document.getElementById('leadForm').addEventListener('submit', function (e) {
      e.preventDefault();

      emailjs.sendForm('service_htt7fgh', 'template_9exxth', this)
        .then(() => {
          window.location.href = "thankyou.html";
        })
        .catch((error) => {
          console.error('EmailJS Error:', error);
          alert('Error, please try again later');
        });
    });
  </script>

</body>
</html>
