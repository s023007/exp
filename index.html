<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dunkin Giveaway</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f9f8;
    }

    header {
      background-color: #7b0000;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }

    .container {
      max-width: 420px;
      background: white;
      margin: 40px auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #c15000;
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {
      color: #333;
      font-size: 15px;
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #a14600;
      color: white;
      border: none;
      font-weight: 600;
    }

    button:hover {
      background-color: #833a00;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>Limited-Time Offer!</header>

  <div class="container">
    <h1>Get Free Dunkin Donuts Samples!</h1>
    <p>Enter your email to claim delicious free samples. Hurry, limited spots!</p>

    <img src="https://images.pexels.com/photos/887850/pexels-photo-887850.jpeg" alt="Dunkin Donuts" />

    <form action="https://usebasin.com/f/9dab7cafe892" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="hidden" name="redirect" value="thankyou.html">
      <button type="submit">Claim Now</button>
    </form>
  </div>

  <footer>
    © 2025 Dunkin Giveaway Campaign. All rights reserved.
  </footer>

</body>
</html>
