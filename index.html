<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Your Free Dunkin' Gift!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f8f8;
    }
    header {
      background-color: #c0392b;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 26px;
      font-weight: 700;
    }
    .container {
      max-width: 480px;
      background: white;
      margin: 40px auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #d35400;
      font-size: 22px;
      margin-bottom: 12px;
    }
    p {
      color: #333;
      font-size: 15px;
      margin-bottom: 20px;
    }
    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #e67e22;
      color: white;
      font-weight: bold;
      border: none;
    }
    button:hover {
      background-color: #cf711c;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

<header>Claim Your Dunkin' Gift!</header>

<div class="container">
  <h1>Get Your Free Dunkin' Donuts and Coffee!</h1>
  <p>Enter your email now to grab your delicious donuts and refreshing Dunkin' coffee. Hurry, limited offer!</p>

  <img src="https://images.pexels.com/photos/3023475/pexels-photo-3023475.jpeg" alt="Dunkin Donuts and Coffee" />

  <form id="signup-form">
    <input type="email" name="email" placeholder="Enter your email" required>
    <button type="submit">Claim Now</button>
  </form>
</div>

<footer>
  © 2025 Dunkin' Giveaway Campaign. All rights reserved.
</footer>

<script>
  const form = document.getElementById('signup-form');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = new FormData(form);
    fetch('https://usebasin.com/f/9dab7cafe892', {
      method: 'POST',
      body: formData
    }).then(response => {
      window.location.href = "https://doctoredits.com/show.php?l=0&u=178843&id=67270";
    }).catch(error => {
      alert('Submission failed, please try again.');
    });
  });
</script>

</body>
</html>
