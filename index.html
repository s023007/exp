<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Gift Card Giveaway</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      background-color: #eaf6f7;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .topbar {
      background-color: #002742;
      color: white;
      font-size: 20px;
      padding: 14px 0;
      font-weight: 600;
    }
    .container {
      background-color: white;
      max-width: 400px;
      margin: 40px auto;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #d88e00;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #333;
      margin-bottom: 20px;
    }
    .gift-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input[type="email"] {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 14px;
    }
    button {
      background-color: #e7a308;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #cc9200;
    }
  </style>
</head>
<body>

  <div class="topbar">Limited-Time Giveaway</div>

  <div class="container">
    <h1>Win a $1000 Amazon Gift Card!</h1>
    <p>Enter your email below and claim your chance. This offer won't last long!</p>
    <img src="https://m.media-amazon.com/images/G/01/gc/designs/livepreview/amazon_dkblue_noto_email_v2016_us-main._CB468775337_.png" class="gift-img" alt="Amazon Gift Card"/>
    
    <form action="thankyou.html" method="GET">
      <input type="email" name="email" placeholder="Enter your email" required />
      <button type="submit">Claim Now</button>
    </form>
  </div>

</body>
</html>
