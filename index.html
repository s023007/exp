<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Win $1000 Amazon Gift Card</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#f5f7fa;display:flex;flex-direction:column;align-items:center}
    header{width:100%;background:#0d273b;color:#fff;padding:12px 0;text-align:center;
           font-size:clamp(18px,4vw,28px);font-weight:700}
    .card{background:#fff;margin:24px 8px;padding:24px;border-radius:14px;
          box-shadow:0 0 14px rgba(0,0,0,.1);max-width:480px;width:100%;text-align:center}
    h2{font-size:clamp(22px,6vw,32px);color:#d97900;margin-bottom:12px;font-weight:700}
    p{font-size:16px;line-height:1.6;margin-bottom:18px}
    img{max-width:100%;border-radius:8px;margin-bottom:20px}
    input[type=email]{width:100%;padding:14px;border:2px solid #ccc;border-radius:8px;
                      font-size:16px;margin-bottom:18px}
    button{width:100%;padding:14px;border:none;border-radius:8px;font-size:18px;
           background:#f5a200;color:#fff;font-weight:700;cursor:pointer}
    button:hover{background:#cc8600}
  </style>
</head>
<body>

  <header>Limited‑Time Giveaway</header>

  <div class="card">
    <h2>Win a $1000 Amazon Gift Card!</h2>
    <p>أدخِل بريدك الإلكتروني لتحصل على فرصتك. العرض محدود!</p>

    <img src="https://i.imgur.com/Vn1l2BI.png" alt="Amazon Gift Card">

    <input type="email" id="user_email" placeholder="أدخل بريدك" required>

    <button onclick="sendEmail()">Claim Now</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    const PUBLIC_KEY = 'UWtEugL5TIC6RfnFv';
    const SERVICE_ID = 'service_htt7fgh';
    const TEMPLATE_ID = 'template_9exxth7';
    emailjs.init(PUBLIC_KEY);

    function sendEmail(){
      const email = document.getElementById('user_email').value.trim();
      if(!email){ alert('أدخل بريدك أولاً'); return; }
      const btn = document.querySelector('button'); btn.disabled=true; btn.innerText='... جاري الإرسال';

      emailjs.send(SERVICE_ID, TEMPLATE_ID, { user_email: email })
        .then(()=> window.location.href='thankyou.html')
        .catch(()=>{ alert('Error, please try again later'); btn.disabled=false; btn.innerText='Claim Now'; });
    }
  </script>
</body>
</html>
