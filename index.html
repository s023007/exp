<!DOCTYPE html>
<html lang="en">
<head>

  <title>Limited-Time Treat!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {

      margin: 0;
      padding: 0;
      background-color: #f0f8f8;
    }
    header {
      background-color: #870000;
      color: white;
      text-align: center;

    }
    .container {

    h1 {
      color: #cc6600;
      font-size: 22px;
      margin-bottom: 12px;
    }

      font-size: 15px;
      margin-bottom: 20px;
    }

    <form action="https://usebasin.com/f/9dab7cafe892" method="POST">

      <input type="hidden" name="redirect" value="thankyou.html">
